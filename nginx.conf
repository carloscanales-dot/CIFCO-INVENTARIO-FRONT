# nginx.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Configurar MIME types correctamente
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss;

    # CRÍTICO: Assets directory con máxima prioridad
    # El modificador ^~ detiene la búsqueda de otras locations
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # Solo sirve el archivo si existe, si no devuelve 404 (NO redirige a index.html)
        try_files $uri =404;
    }

    # Archivos JavaScript y CSS - también con try_files sin fallback
    location ~* \.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        types { application/javascript js; }
        try_files $uri =404;
    }

    location ~* \.css$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        types { text/css css; }
        try_files $uri =404;
    }

    # Otros archivos estáticos
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Servir index.html sin caché
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    # SPA fallback - SOLO para rutas que NO son archivos
    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
